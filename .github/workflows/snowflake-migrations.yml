name: Run Snowflake Migrations

on:
  push:
    branches: [ main ]

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Snow CLI
        run: pip install snowflake-cli-labs

      - name: Configure Snowflake credentials
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        run: |
          snow configure account --account $SNOWFLAKE_ACCOUNT
          snow configure user --username $SNOWFLAKE_USER --password $SNOWFLAKE_PASSWORD
          snow configure default --role $SNOWFLAKE_ROLE --database $SNOWFLAKE_DATABASE --schema $SNOWFLAKE_SCHEMA --warehouse $SNOWFLAKE_WAREHOUSE

      - name: Run migration scripts
        run: |
          for dir in $(ls -d migration-scripts/v* | sort); do
            for file in $dir/*.sql; do
              echo "Running $file"
              snow sql -f $file
            done
          done